# Place this file at /etc/nginx/sites-available/formatting-tool
# then: sudo ln -s /etc/nginx/sites-available/formatting-tool /etc/nginx/sites-enabled/
#
# Replace `server_name` with your VM's internal hostname or IP so employees
# can reach it, e.g. formatting-tool.internal.yourcompany.com or the VM's
# LAN IP address.

server {
    listen 80;
    server_name formatting-tool.internal;   # <-- EDIT THIS

    client_max_body_size 30M;   # allow reasonably large Word documents

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Formatting can take a few seconds on large documents.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
